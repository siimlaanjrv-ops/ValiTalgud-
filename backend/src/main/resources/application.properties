spring.application.name=valitalgud

# Actuator - ekspoonee health endpoint LandingPage taski jaoks
management.endpoints.web.exposure.include=health

# Groq AI vestlusrobot. API votme loeb GROQ_API_KEY keskkonnamuutujast
# (backend/env failist voi paris keskkonnamuutujast). Vaata backend/.env.example.
groq.base-url=https://api.groq.com/openai/v1
groq.model=openai/gpt-oss-20b
groq.api-key=${GROQ_API_KEY:}
groq.temperature=0.5
groq.max-completion-tokens=1024

# Resend (kontaktivormi meilid). API votme loeb RESEND_API_KEY keskkonnamuutujast,
# saaja ja saatja aadressid CONTACT_TO_EMAIL / RESEND_FROM_EMAIL muutujatest (backend/.env).
# Vaata backend/.env.example.
resend.base-url=https://api.resend.com
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
resend.to-email=${CONTACT_TO_EMAIL:}

# PostgreSQL
# P6Spy - settings
spring.datasource.url=jdbc:p6spy:postgresql://localhost/postgres
spring.datasource.driverClassName=com.p6spy.engine.spy.P6SpyDriver

# normal settings
#spring.datasource.driverClassName=org.postgresql.Driver
#spring.datasource.url=jdbc:postgresql://localhost/postgres
spring.datasource.username=postgres
spring.datasource.password=student123

# JPA stuff
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Enable SQL initialization
spring.sql.init.mode=always

# Disable Hibernate DDL generation to avoid conflicts
spring.jpa.hibernate.ddl-auto=none