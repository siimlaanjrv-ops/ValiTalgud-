spring.application.name=valitalgud

# Actuator - ekspoonee health endpoint LandingPage taski jaoks
management.endpoints.web.exposure.include=health

# Groq AI vestlusrobot. API votme loeb GROQ_API_KEY keskkonnamuutujast
# (backend/env failist voi paris keskkonnamuutujast). Vaata backend/.env.example.
groq.base-url=https://api.groq.com/openai/v1
groq.model=llama-3.3-70b-versatile
groq.api-key=${GROQ_API_KEY:}
groq.temperature=0.8
groq.max-completion-tokens=768

# Gmail SMTP (kontaktivormi meilid). Kasutajanimi ja App Password loetakse
# GMAIL_USERNAME / GMAIL_APP_PASSWORD keskkonnamuutujast (backend/.env).
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=intelligitapi@gmail.com
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
contact.to-email=intelligitapi@gmail.com

# PostgreSQL
# P6Spy - settings
spring.datasource.url=jdbc:p6spy:postgresql://localhost/postgres
spring.datasource.driverClassName=com.p6spy.engine.spy.P6SpyDriver

# normal settings
#spring.datasource.driverClassName=org.postgresql.Driver
#spring.datasource.url=jdbc:postgresql://localhost/postgres
spring.datasource.username=postgres
spring.datasource.password=student123

# JPA stuff
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Enable SQL initialization
spring.sql.init.mode=always

# Disable Hibernate DDL generation to avoid conflicts
spring.jpa.hibernate.ddl-auto=none